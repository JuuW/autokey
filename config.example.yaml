# AutoKey 配置示例
# 复制为 config.yaml 后填入你自己的信息:
#   python -m autokey init-config
#
# ⚠️ config.yaml 会包含明文密码,已被 .gitignore 忽略,切勿分享或提交。

# 全局设置(可选,缺省会用下面这些默认值)
settings:
  type_interval: 0.1    # 剪贴板粘贴前后的等待秒数,太小可能粘贴失败或漏字
  start_delay: 0.15     # 触发后到开始输入的延迟,让快捷键的按键先释放

# 快捷键 → 动作序列
hotkeys:
  - name: "登录公司系统"
    combo: "<ctrl>+l"            # 组合键,pynput 语法
    actions:
      - type: "myusername@corp.co3333m"   # 输入一段文本
      - key: "tab"                    # 按一个特殊键
      - type: "MyS3cretPass"          # 密码(明文,谨慎保管)
      - key: "enter"

  - name: "只填邮箱"
    combo: "<ctrl>+<alt>+e"
    actions:
      - type: "myusername@corp.com"

# 弹出菜单(可选):快捷键太多记不住时,用一个快捷键弹出列表来选
# 按下 combo → 弹出原生列表 → 点/选一项 → 自动执行该项的 actions。
# hotkeys 和 menu 至少要有一个;两者可并存。
menu:
  combo: "<ctrl>+menu"              # 唤出菜单的快捷键
  title: "选择要输入的内容"        # 可选,弹窗提示文字
  items:
    - name: "公司邮箱登录"          # 列表里显示的文字(必填、需唯一)
      actions:                    # 与 hotkey 的 actions 语义完全相同
        - type: "myusername@corp.com"
        - key: "tab"
        - type: "MyS3cretPass"
        - key: "enter"
    # 上面 6 行等价于下面这一行“紧凑写法”:
    - "公司邮箱登录2 = myusername@corp.com → [tab] → MyS3cretPass → [enter]"
    - "只填邮箱 = myusername@corp.com"

# 紧凑写法(可选,与上面的多行写法可混用):
#   把列表项直接写成一行字符串:"名称 = 动作1 → 动作2 → ..."
#     · 第一个 = 左边是名称(menu 项)或组合键(hotkeys 项),右边是动作序列。
#     · 动作之间用 → 分隔;[键名] 表示按特殊键,其余片段表示输入文本。
#     · 文本片段前后空格会被去掉;名称/文本里请勿使用 = 和 →。
#   hotkeys 也支持,此时 = 左边是组合键并兼作名称,例如:
#     hotkeys:
#       - "<ctrl>+l = myusername@corp.com → [tab] → MyS3cretPass → [enter]"

# combo 语法:
#   修饰键写成 <ctrl> <alt>(即 Option) <cmd> <shift>,普通键直接写字母/数字。
#   例:"<ctrl>+<shift>+p"、"<cmd>+<alt>+1"
#
# action 每一项只能是下面二者之一:
#   type: "文本"    通过剪贴板粘贴(Cmd+V),不受输入法影响,支持中文
#   key:  "键名"    按一个特殊键,支持:
#     tab enter esc space backspace delete
#     up down left right home end page_up page_down
#     f1 f2 ... f12
